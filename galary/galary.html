<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery | Sketches Of Shri</title>

    <link rel="stylesheet" href="galary.css">
</head>

<body>
    <div class="container">

        <header>
            <h1>Art Gallery</h1>
            <nav>
                <a href="/index.html">Home</a>
                <a href="../contacts/contact.html">Book now</a>
            </nav>
        </header>

        <section>

            <div class="gallery">
                <img src="../arts/art1.jpg" onclick="openLightbox(this.src)">
                <img src="../arts/art2.jpg" onclick="openLightbox(this.src)">
                <img src="../arts/art3.jpg" onclick="openLightbox(this.src)">
                <img src="../arts/art4.jpg" onclick="openLightbox(this.src)">
                <img src="../arts/art5.jpg" onclick="openLightbox(this.src)">
                <img src="../arts/art6.jpg" onclick="openLightbox(this.src)">
                <img src="../arts/art7.jpg" onclick="openLightbox(this.src)">
                <img src="../arts/art8.jpg" onclick="openLightbox(this.src)">
                <img src="../arts/art9.jpg" onclick="openLightbox(this.src)">
                <img src="../arts/art10.jpg" onclick="openLightbox(this.src)">
                <img src="../arts/advika.jpg" onclick="openLightbox(this.src)">
                <img src="../arts/nithi.jpg" onclick="openLightbox(this.src)">
                <img src="../arts/babu.jpg" onclick="openLightbox(this.src)">
                <img src="../arts/ghost shade.jpg" onclick="openLightbox(this.src)">
                <img src="../arts/sreeleela.jpg" onclick="openLightbox(this.src)">
            </div>
        </section>

        <div class="lightbox" id="lightbox" onclick="closeLightbox()">
            <img id="lightbox-img" src="">
        </div>

    </div> <!-- END container -->

    <script>
        function openLightbox(src) {
            document.getElementById('lightbox-img').src = src;
            document.getElementById('lightbox').style.display = 'flex';
        }
        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
        }
    </script>
</body>

</html>
