<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Sketches of Shri</title>

    <!-- contact.css is in the same folder as this file (contacts/) -->
    <link rel="stylesheet" href="contact.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Achievements CSS & JS (one level up, then achivements/) -->
    <link rel="stylesheet" href="../achivements/achivement.css">
    <script src="../achivements/achivement.js" defer></script>
</head>

<body>

    <header>
        <h1>Contact Me</h1>
        <nav>
            <!-- FIXED: Use relative path instead of /index.html -->
            <a href="../index.html">Home</a>
            <a href="#" id="openAchievements">Achievements</a>
        </nav>
    </header>

    <main class="container">
        <section>
            <h2>Select any one application below to book your order</h2>
            <p>Email, WhatsApp or Instagram to order your custom portrait.</p>

            <div class="contact-icons skew-shake-x">
                <a href="mailto:sketchesofshri@gmail.com"><i class="fas fa-envelope"></i></a>
                <a href="https://instagram.com/sketchesofshri" target="_blank"><i class="fab fa-instagram"></i></a>
                <a href="https://wa.me/918217637065" target="_blank"><i class="fab fa-whatsapp"></i></a>
                <a href="https://wa.me/918147829522" target="_blank"><i class="fab fa-whatsapp"></i></a>
            </div>
        </section>
    </main>

    <div id="popupContainer"></div>

    <script>
        fetch('../achivements/achivement.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('popupContainer').innerHTML = data;

                // Initialize popup JS after HTML is loaded
                const modal = document.getElementById("achievementsModal");
                const content = modal.querySelector(".modal-content");
                const openBtn = document.getElementById("openAchievements");
                const closeBtn = document.getElementById("closePopup");

                openBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    modal.classList.add("show");
                    setTimeout(() => content.classList.add("show"), 10);
                });

                function closeModal() {
                    content.classList.remove("show");
                    setTimeout(() => modal.classList.remove("show"), 300);
                }

                closeBtn.addEventListener('click', closeModal);

                window.addEventListener('click', (e) => {
                    if (e.target === modal) closeModal();
                });
            });
    </script>

    <footer>
        <p>&copy; 2025 Sketches of Shri</p>
    </footer>

</body>

</html>
